[project]
name = "amazon-explorer"
version = "0.1.0"
description = "自然言語からAmazon商品候補を検索・正規化・ランキングするStreamlitアプリ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "scikit-learn>=1.7.2",
    "streamlit>=1.57.0",
    "sudachidict-core>=20260428",
    "sudachipy>=0.6.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]
